<style>

<script>
const N=a=>a.map(t=>({t}));
const YN=N(['Yes','No']);
const HB=['suitcase','passport','flip-flops','raincoat','umbrella','charger','pillow','land','arrive','explore','take off','catch a bus','homework','football','sandwich','laptop'];
const HOK=HB.slice(0,12);
const EM=['Dear students,','We can now send you information about our school trip to Bahla. The trip is next Sunday (16th April). Please arrive at the school at 4 p.m. The roads are very busy then, so don’t be late. The express coach leaves at 4.30 p.m. and we arrive at Bahla at 6.30 p.m.','Our hotel is near the famous Bahla fort. We’re lucky because the hotel has a brand-new swimming pool. Remember to bring your swimsuit and your flip-flops, and you can swim before dinner. Dinner is at 7 p.m. every evening.','On Monday, we visit the famous Bahla fort, which has been a UNESCO World Heritage site since 1987. You need to bring a wallet, with some money to buy a sandwich and a drink. The weather is usually hot in Bahla. Bring your sunhat and light clothes. You must wear trainers or comfortable shoes because we’re going to do a lot of walking.','We’re going to look around the fort. You can see some wonderful views from the walls at the top. We’re also going to look around the town and the souq. Bring enough money to buy a gift if you want.','On Tuesday, after breakfast, pack your suitcase and wait at the hotel entrance. The coach back to Muscat leaves at 9 a.m. and arrives at the school at about 11 a.m.','We’re sure that you will have a lovely time in Bahla and look forward to seeing you soon. Yours, Mr Sultan, head teacher'];
const VW=['express','busy','lucky','lovely','brand-new','wonderful'];
const WD=N(['express','busy','lucky']);
const PK=[['swimsuit',1],['flip-flops',1],['wallet with money',1],['sunhat',1],['light clothes',1],['trainers',1],['winter coat',0],['snow boots',0],['blanket',0],['laptop',0],['pencil case',0],['torch',0]];
const qt=(w)=>'Do the children need to take a '+w+'?';
const A=[
{n:'1 · The ball is burning',min:3,type:'hot'},
{n:'2 · Before you read',min:2,type:'mc',q:[
{pr:'Do the children need to take a <b>swimsuit</b>?',o:YN,a:0,ex:'There is a brand-new swimming pool.'},
{pr:'Do the children need to take a <b>pencil case</b>?',o:YN,a:1,ex:'It isn’t in the email.'},
{pr:'Do the children need to take a <b>suitcase</b>?',o:YN,a:0,ex:'“Pack your suitcase.”'},
{pr:'Do the children need to take a <b>laptop</b>?',o:YN,a:1,ex:'It isn’t in the email.'},
{pr:'Do the children need to take <b>money</b>?',o:YN,a:0,ex:'“Bring a wallet with some money.”'},
{pr:'Do the children need to take a <b>blanket</b>?',o:YN,a:1,ex:'It isn’t in the email.'},
{pr:'Do the children need to take <b>flip-flops</b>?',o:YN,a:0,ex:'“Remember to bring your swimsuit and your flip-flops.”'},
{pr:'Do the children need to take a <b>torch</b>?',o:YN,a:1,ex:'It isn’t in the email.'}]},
{n:'3 · Listen and read',min:5,type:'email'},
{n:'4 · Words in context',min:3,type:'mc',q:[
{pr:'What a ___ photo of your family. Everyone looks so happy.',o:N(['lovely','busy','express']),a:0},
{pr:'The hospital was very ___. I had to wait an hour to see the doctor.',o:N(['lucky','busy','brand-new']),a:1},
{pr:'My parents used to have an old car, but now they have a ___ one.',o:N(['brand-new','busy','express']),a:0},
{pr:'Marwa won first prize at the science fair! That’s ___ news!',o:N(['busy','express','wonderful']),a:2},
{pr:'Don’t take the regular train. You’ll be late. Take the ___ train.',o:N(['lucky','express','lovely']),a:1},
{pr:'The weather was cloudy when I visited Al Buraimi in February. I was so ___!',o:N(['lucky','busy','express']),a:0}]},
{n:'5 · Read and complete',min:4,type:'mc',q:[
{pr:'On day one, students must be at the school at ___.',o:N(['4.30 p.m.','4 p.m.','6.30 p.m.']),a:1},
{pr:'The express coach leaves at ___.',o:N(['6.30 p.m.','7 p.m.','4.30 p.m.']),a:2},
{pr:'The coach arrives at Bahla at ___.',o:N(['6.30 p.m.','4.30 p.m.','4 p.m.']),a:0},
{pr:'At the hotel, they have dinner at ___.',o:N(['6.30 p.m.','7.00 p.m.','4.30 p.m.']),a:1},
{pr:'They visit Bahla Fort the ___ day.',o:N(['next','last','first']),a:0},
{pr:'They must wear trainers because they are ___ to do a lot of walking.',o:N(['going','will','went']),a:0},
{pr:'After ___ on day three, they must pack their suitcase.',o:N(['dinner','breakfast','lunch']),a:1},
{pr:'The coach to Muscat ___ at 9 a.m.',o:N(['arrives','leaves','lands']),a:1},
{pr:'They ___ at the school at about 11 a.m.',o:N(['arrive','leave','pack']),a:0}]},
{n:'6 · Answer the questions',min:3,type:'mc',q:[
{pr:'How are the students going to get to Bahla?',o:N(['They are going to take an express coach.','They are going to fly.','They are going to take a train.']),a:0},
{pr:'Why mustn’t they be late?',o:N(['The hotel is full.','The roads are very busy then.','The fort closes.']),a:1},
{pr:'What is special about the hotel?',o:N(['It is next to the sea.','It is very old.','It has a brand-new swimming pool.']),a:2},
{pr:'Why should they take a sunhat?',o:N(['Bahla is in the desert so the weather is usually very hot.','It is going to rain.','It is a school rule.']),a:0},
{pr:'What can they see from the walls of the fort?',o:N(['A big river.','Wonderful views of the city.','Snow mountains.']),a:1}]},
{n:'7 · Pack your bag',min:2,type:'pack'},
{n:'8 · Final task',min:3,type:'cloze'}];
const CL=7;
const C={t:'The school trip to {0} (1) is next Sunday. The express coach leaves at {1} (2). The hotel is {2} (3) the famous Bahla fort. Students must wear {3} (4) because they are going to do a lot of walking. They need a {4} (5) because the weather is hot.',o:[['Salalah','Bahla','Nizwa'],['6.30 p.m.','4 p.m.','4.30 p.m.'],['near','far from','inside'],['flip-flops','sandals','trainers'],['raincoat','blanket','sunhat']],a:[1,2,0,2,2]};
const nst=()=>({i:0,pk:null,sc:0,done:false,ans:{},chk:false,hl:null,started:false,t:40,over:false,pw:{},bag:{},msg:''});
let S={step:0,st:A.map(nst)},TM=null;
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const GOOD=()=>tone([523,659,784,1047],.1,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');
function go(k){tone([523,659],.1);try{speechSynthesis.cancel()}catch(e){}S.step=k;render()}
function hstart(){const s=S.st[0];clearInterval(TM);Object.assign(s,{started:true,t:40,over:false,pw:{},sc:0});tone([392,523,659],.1);TM=setInterval(()=>{s.t--;if(s.t<=0){clearInterval(TM);s.over=true;tone([523,659,784,1047],.14,'triangle')}render()},1000);render()}
function hp(w){const s=S.st[0];if(!s.started||s.over||s.pw[w])return;if(HOK.includes(w)){s.pw[w]=1;s.sc++;GOOD();say(w)}else{s.pw[w]=-1;BAD()}render()}
function line(i){S.st[2].hl=i;say(EM[i]);render()}
function play(){try{speechSynthesis.cancel();EM.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;u.onstart=()=>{S.st[2].hl=i;render()};speechSynthesis.speak(u)})}catch(e){}}
function pick(i){const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}
function retry(){clearInterval(TM);S.st[S.step]=nst();tone([440,523],.1);render()}
function pk(i){const s=S.st[6];if(s.bag[i]!==undefined)return;if(PK[i][1]){s.bag[i]=1;s.sc++;GOOD();s.msg='Good! Pack the '+PK[i][0]+'.'}else{s.bag[i]=0;BAD();s.msg='No! You don’t need a '+PK[i][0]+' in Bahla.'}render()}
function cl(g,i){const s=S.st[CL];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[CL];if(Object.keys(s.ans).length<5){tone([220],.15,'square');return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s.slice(0,CL).reduce((x,y)=>x+y.sc,0)+(s[CL].chk?C.a.filter((a,g)=>s[CL].ans[g]===a).length:0)}
const bar=t=>'<div class="bar"><i></i><i></i><i></i><span>Inbox · '+t+'</span></div>';
function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card">'+bar(a.n)+'<div class="big-stamp">'+s.sc+' / '+n+'</div><div class="fb" style="justify-content:center">'+(s.sc===n?'Excellent! Wonderful work!':s.sc>=n-1?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<CL?'<button class="go" onclick="go('+(S.step+1)+')">Next stop →</button>':'')+'</div></div>';
 const pr=q.pr.replace('___',lk?'<b>'+q.o[q.a].t+'</b>':'______');
 return '<div class="card">'+bar(a.n+' · '+a.min+' min')+'<div class="meta"><span>Question '+(s.i+1)+' / '+n+'</span><span>Keys: '+s.sc+'</span></div><div class="q">'+pr+'</div><div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')"><span>'+o.t+'</span></button>').join('')+'</div><div class="fb">'+(lk?'<span class="seal'+(ok?'':' no')+'">'+(ok?'GREAT!':'TRY<br>AGAIN')+'</span><span>The answer is: '+q.o[q.a].t+'. '+(q.ex||'')+'</span>':'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
 if(a.type==='hot'){const ch=HB.map(w=>{const v=s.pw[w];return '<button class="wc'+(v===1?' ok':v===-1?' bad':'')+'" onclick="hp(\''+w+'\')">'+w+'</button>'}).join('');return '<div class="card">'+bar(a.n+' · '+a.min+' min')+'<div class="meta"><span>Hot ball! Tap words from Holiday equipment and Transport verbs</span><span class="tm">'+(s.started?s.t:'40')+' s</span></div><div class="learn">The ball is burning! Tap the words from this unit before the time is up. Careful: some words are not from the unit!</div><div class="row" style="justify-content:flex-start">'+ch+'</div><div class="fb">'+(s.over?'Time’s up! You found '+s.sc+' / 12 words.':s.started?'Found: '+s.sc+' / 12':'')+'</div><div class="row">'+(s.started&&!s.over?'':'<button class="go alt" onclick="hstart()">'+(s.over?'Play again':'Start the 40 seconds')+'</button>')+'<button class="go" onclick="go(1)">Before you read →</button></div></div>'}
 if(a.type==='email'){const hi=t=>VW.reduce((x,w)=>x.replace(new RegExp('\\b'+w+'\\b','gi'),m=>'<b>'+m+'</b>'),t);return '<div class="card">'+bar(a.n+' · '+a.min+' min')+'<div class="learn"><b>Reading tip:</b> You don’t have to look up every word! Not every word is important. Words in context: '+VW.map(w=>'<b>'+w+'</b>').join(' · ')+'</div><div class="mh"><b>To:</b> Grade 7 students<br><b>Subject:</b> School trip to Bahla</div><div class="row" style="justify-content:flex-start"><button class="go alt" style="padding:8px 24px;font-size:18px" onclick="play()">▶ Listen to the email</button></div><div class="mail">'+EM.map((t,i)=>'<button class="s'+(s.hl===i?' sel':'')+'" onclick="line('+i+')">'+hi(t)+'</button>').join('')+'</div><button class="go" onclick="go(3)">Words in context →</button></div>'}
 if(a.type==='pack'){const bag=PK.filter((p,i)=>s.bag[i]===1).map(p=>'<span>'+p[0]+'</span>').join('');return '<div class="card">'+bar(a.n+' · '+a.min+' min')+'<div class="learn">What do you need for the school trip to Bahla? Tap an item to put it in your bag. Pack all <b>6</b> things you need!</div><div class="row" style="justify-content:flex-start">'+PK.map((p,i)=>'<button class="wc'+(s.bag[i]===1?' ok':s.bag[i]===0?' bad':'')+'" onclick="pk('+i+')">'+p[0]+'</button>').join('')+'</div><div class="fb">'+s.msg+'</div><div class="bag" aria-label="My bag">'+(bag||'<em>My bag is empty</em>')+'</div><div class="fb">'+(s.sc===6?'Your bag is ready for Bahla! You are a wonderful packer!':'Packed: '+s.sc+' / 6')+'</div><div class="row"><button class="go alt" onclick="retry()">Start again</button><button class="go" onclick="go(7)">Final task →</button></div></div>'}
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>',n=C.a.filter((x,i)=>s.ans[i]===x).length;
 return '<div class="card">'+bar('Finishing the lesson · Reading')+'<div class="meta"><span>Reading an email</span><b>(5 marks)</b></div><div style="font-style:italic;font-size:18px">For each item, shade in the bubble next to the correct option.</div><div class="box">'+C.t.replace(/\{(\d)\}/g,(m,i)=>g(+i))+'</div>'+C.o.map((os,gi)=>'<div class="cz"><b>'+(gi+1)+')</b>'+os.map((w,i)=>{const sel=s.ans[gi]===i,cls=s.chk&&i===C.a[gi]?' ok':s.chk&&sel?' bad':'';return '<button class="o'+(sel?' sel':'')+cls+'" onclick="cl('+gi+','+i+')"><span class="dot"></span>'+w+'</button>'}).join('')+'</div>').join('')+(s.chk?'<div class="big-stamp">'+n+' / 5</div>':'')+'<div class="row"><span style="margin-right:auto;font-size:20px;font-weight:700">'+(s.chk?(n===5?'Excellent! Wonderful reading!':'Review: '+C.a.map((x,i)=>s.ans[i]!==x?C.o[i][x]:null).filter(Boolean).join(', ')):'Answer all 5 items, then press Check.')+'</span><button class="go alt" onclick="chk()">Check</button><button class="go" onclick="retry()">Try again</button></div><div class="credit">Created by T.Badria Alfalahi</div></div>'}
function render(){
 const L=A.length-1;
 document.getElementById('nav').innerHTML='<span>Choose your stop:</span>'+A.map((a,k)=>'<button class="'+(k===S.step?'on':'')+'" onclick="go('+k+')">'+a.n+'</button>').join('');
 document.getElementById('stars').textContent=stars();
 document.getElementById('pl').style.left=(S.step/L*(100)-0)+'%';
 document.getElementById('stations').innerHTML=A.map((a,k)=>'<span class="st'+(k<=S.step?' on':'')+'" style="left:'+(k/L*100)+'%"></span>').join('');
 document.getElementById('main').innerHTML=view()}
render();
</script></body></html>
